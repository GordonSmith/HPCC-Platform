name: Branch Synchronization
run-name: Branch sync (${{ github.event_name }})

on:
  # schedule:
  #   - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation mode
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      repository:
        description: Policy repository ID, or all configured repositories
        required: true
        type: choice
        options:
          - all
          - platform
          - ln
          - eclide
          - hpcc4j
          - helm-chart
        default: all

permissions:
  contents: read

concurrency:
  group: branch-synchronization-${{ github.repository }}
  # Never cancel a writer in progress. GitHub keeps only the newest pending run;
  # each run reconciles the full configured ref set, so a superseded run is recovered.
  cancel-in-progress: false

jobs:
  synchronize:
    name: Validate and synchronize approved refs
    if: ${{ github.repository == 'risk-hsy/HPCC-Platform' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INPUT_MODE: ${{ inputs.mode || 'dry-run' }}
      INPUT_REPOSITORY: ${{ inputs.repository || 'all' }}

    steps:
      - name: Checkout workflow and policy repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          submodules: false

      - name: Resolve mode and validate policy
        id: settings
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            mode=apply
          else
            mode="$INPUT_MODE"
          fi
          jq -e '
            .schema_version == 1 and
            (.paused | type == "boolean") and
            (.repositories | type == "array" and length > 0) and
            (.repositories | all(.[];
              (.id | type == "string" and length > 0) and
              (.source | type == "string" and length > 0) and
              (.destination | type == "string" and length > 0) and
              (.sync_enabled | type == "boolean")
            ))
          ' branch-policy.json >/dev/null
          paused=$(jq -r '.paused' branch-policy.json)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "paused=$paused" >> "$GITHUB_OUTPUT"
          if [[ "$mode" == "apply" && "$paused" == "true" ]]; then
            echo "## Branch synchronization: paused" >> "$GITHUB_STEP_SUMMARY"
            echo "Policy is paused; no remotes will be fetched or changed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Mode: \`$mode\`; repository selection: \`$INPUT_REPOSITORY\`; policy paused: \`$paused\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create internal App token
        id: internal-token
        if: ${{ steps.settings.outputs.paused != 'true' || steps.settings.outputs.mode == 'dry-run' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BRANCH_APP_ID_INTERNAL }}
          private-key: ${{ secrets.BRANCH_APP_PRIVATE_KEY_INTERNAL }}
          owner: risk-hsy
          repositories: HPCC-Platform,ln,eclide,hpcc4j,helm-chart
          permission-contents: read

      - name: Create OSS App token
        id: oss-token
        if: ${{ steps.settings.outputs.paused != 'true' || steps.settings.outputs.mode == 'dry-run' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BRANCH_APP_ID_OSS }}
          private-key: ${{ secrets.BRANCH_APP_PRIVATE_KEY_OSS }}
          owner: hpcc-systems
          repositories: HPCC-Platform,ln,eclide,hpcc4j,helm-chart
          permission-contents: write
          permission-workflows: write

      - name: Fetch and selectively synchronize refs
        shell: bash
        env:
          BRANCH_APP_TOKEN_INTERNAL: ${{ steps.internal-token.outputs.token }}
          BRANCH_APP_TOKEN_OSS: ${{ steps.oss-token.outputs.token }}
        run: |
          set -euo pipefail
          bash tools/tagging/sync-oss-branches.sh \
            --policy "$GITHUB_WORKSPACE/branch-policy.json" \
            --mode "${{ steps.settings.outputs.mode }}" \
            --repository "$INPUT_REPOSITORY"

  notify-failure:
    name: Notify Teams of failure
    needs: synchronize
    if: ${{ always() && needs.synchronize.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post failure notification
        shell: bash
        env:
          CICD_WEBHOOK_URL: ${{ secrets.CICD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          : "${CICD_WEBHOOK_URL:?CICD_WEBHOOK_URL secret is missing}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message="$GITHUB_WORKFLOW failed in $GITHUB_REPOSITORY (run $GITHUB_RUN_NUMBER, attempt $GITHUB_RUN_ATTEMPT)."
          jq -n --arg message "$message" --arg url "$run_url" '{
            type: "message",
            attachments: [{
              contentType: "application/vnd.microsoft.card.adaptive",
              contentUrl: null,
              content: {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                type: "AdaptiveCard",
                version: "1.2",
                body: [{type: "TextBlock", text: $message, wrap: true}],
                actions: [{type: "Action.OpenUrl", title: "View failed run", url: $url}]
              }
            }]
          }' | curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header 'Content-Type: application/json' \
            --data-binary @- "$CICD_WEBHOOK_URL"
